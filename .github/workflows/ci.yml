name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci: install exactly the committed lockfile (S10). It is in sync with
      # package.json; if a dependency change ever leaves it behind, npm ci
      # fails loudly instead of resolving something new.
      - run: npm ci --no-fund
      # Advisories against what ships (runtime deps). SheetJS installs from its
      # CDN tarball, which the registry advisory feed doesn't cover — track its
      # releases by hand.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
